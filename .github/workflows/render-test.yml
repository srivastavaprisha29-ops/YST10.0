name: Local video smoke test
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: python3 engine.py examples/storyboard.json output/demo.mp4
      - run: ffprobe -v error -show_streams output/demo.mp4 && test -s output/demo.srt
      - uses: actions/upload-artifact@v4
        with:
          name: sample-video
          path: output/
